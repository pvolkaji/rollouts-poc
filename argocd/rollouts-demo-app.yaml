apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rollouts-demo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/pvolkaji/rollouts-poc.git
    targetRevision: main
    path: apps/rollouts-demo

  destination:
    server: https://kubernetes.default.svc
    namespace: rollouts-poc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
